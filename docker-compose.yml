services:
  openvpn:
    build:
      context: .
      args:
        VPN_PORT: 24443

    container_name: openvpn-c2c
    restart: unless-stopped

    ports:
      - "24443:24443/udp"

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      net.ipv4.ip_forward: "1"

    environment:
      VPN_PORT: "24443"
      OVPN_REMOTE: "vpn.example.com"

    volumes:
      - ./openvpn-data:/var/lib/openvpn
